name: Build horeca-snackyou (exe + installer)

# Construiește pe windows-latest: executabilul (PyInstaller) și installer-ul
# (Inno Setup). Publică ambele ca artifacte. Rulează la push și manual.

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalează dependințele
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Construiește executabilul (.exe)
        run: >
          pyinstaller --onefile --console --name horeca-snackyou
          --collect-all httpx --collect-all httpcore --collect-all certifi
          --hidden-import pymysql --hidden-import pymysql.cursors
          horeca_snackyou.py

      - name: Instalează Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construiește installer-ul
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publică artifactele (exe + installer)
        uses: actions/upload-artifact@v4
        with:
          name: horeca-snackyou
          path: |
            dist/horeca-snackyou.exe
            installer_out/horeca-snackyou-setup.exe
          if-no-files-found: error
